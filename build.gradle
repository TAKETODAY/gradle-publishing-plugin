plugins {
  id 'com.gradle.plugin-publish' version '2.2.1'
  id "cn.taketoday.publishing" version "0.0.1"
}

apply plugin: "java"
apply plugin: "signing"
apply plugin: "maven-publish"
apply plugin: "java-gradle-plugin"

group = 'cn.taketoday'
description = 'Gradle plugin to publishing to Maven Central'

ext {
  isSnapshot = version.endsWith('SNAPSHOT')
  isReleaseVersion = !isSnapshot
}

java {
  sourceCompatibility = 17
  targetCompatibility = 17
}

repositories {
  mavenCentral()
  mavenLocal()
  maven { url = "https://central.sonatype.com/repository/maven-snapshots/" }
}


dependencies {
  implementation "cn.taketoday:infra-web-client:$infraVersion"

  implementation 'org.json:json:20251224'
}


gradlePlugin {
  website = "https://github.com/TAKETODAY/gradle-publishing-plugin"
  vcsUrl = "https://github.com/TAKETODAY/gradle-publishing-plugin"
  plugins {
    create('publishingPlugin') {
      id = "cn.taketoday.publishing"
      tags = ['maven-central', 'maven-central-portal', 'publishing', 'snapshots']
      displayName = "Gradle Publishing Plugin"
      description = "Gradle Publishing Plugin"
      implementationClass = "cn.taketoday.publishing.PublishingPlugin"
    }
  }
}


publishing {
  publications.withType(MavenPublication).configureEach {
    pom {
      name = 'Gradle Publishing Plugin'
      description = project.description
      url = 'https://github.com/TAKETODAY/gradle-publishing-plugin'
      licenses {
        license {
          name = 'Apache License, Version 2.0'
          url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
        }
      }
      developers {
        developer {
          id = 'TAKETODAY'
          name = '海子 Yang'
          url = 'https://github.com/TAKETODAY'
        }
      }
      scm {
        connection = 'scm:git:https://github.com/TAKETODAY/gradle-publishing-plugin.git'
        developerConnection = 'scm:git:ssh://git@github.com/TAKETODAY/gradle-publishing-plugin.git'
        url = 'https://github.com/TAKETODAY/gradle-publishing-plugin'
      }
    }
  }
}

signing {
  def signingKey = findProperty("signingKey")
  def signingKeyId = findProperty("signingKeyId")
  def signingPassword = findProperty("signingPassword")
  useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
  sign(publishing.publications)
}
